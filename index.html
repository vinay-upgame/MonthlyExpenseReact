<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/MonthlyExpenseReact/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="Monthly Expense Tracker - Track daily expenses, weekly payments, and manage monthly budgets" />
    <meta name="theme-color" content="#3b82f6" />
    <link rel="manifest" href="/MonthlyExpenseReact/manifest.json" />
    <title>Monthly Expense Tracker</title>
    <script type="module" crossorigin src="/MonthlyExpenseReact/assets/index-BpfqBFpP.js"></script>
    <link rel="stylesheet" crossorigin href="/MonthlyExpenseReact/assets/index-CmMtpf-N.css">
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Service Worker registration
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          // Check if we're in development (localhost or 127.0.0.1)
          const isDevelopment = window.location.hostname === 'localhost' || 
                                window.location.hostname === '127.0.0.1' ||
                                window.location.hostname === '';
          
          if (isDevelopment) {
            // In development, unregister any existing service workers
            navigator.serviceWorker.getRegistrations().then((registrations) => {
              for (let registration of registrations) {
                registration.unregister().then(() => {
                  console.log('Service Worker unregistered for development');
                });
              }
            });
          } else {
            // In production, register service worker
            navigator.serviceWorker.register('/service-worker.js')
              .then((registration) => {
                console.log('Service Worker registered:', registration);
              })
              .catch((error) => {
                console.log('Service Worker registration failed:', error);
              });
          }
        });
      }
    </script>
  </body>
</html>
