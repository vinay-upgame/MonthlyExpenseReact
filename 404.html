<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/MonthlyExpenseReact/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="Monthly Expense Tracker - Track daily expenses, weekly payments, and manage monthly budgets" />
    <meta name="theme-color" content="#3b82f6" />
    <link rel="manifest" href="/MonthlyExpenseReact/manifest.json" />
    <title>Monthly Expense Tracker</title>
    <script type="module" crossorigin src="/MonthlyExpenseReact/assets/index-fUtNNQlm.js"></script>
    <link rel="stylesheet" crossorigin href="/MonthlyExpenseReact/assets/index-C2Fd7wFa.css">
    <script>
      // Rewrite URL for React Router on GitHub Pages 404
      (function() {
        var path = window.location.pathname;
        // Remove /MonthlyExpenseReact prefix if present
        var cleanPath = path.replace(/^\/MonthlyExpenseReact/, '');
        // Rewrite URL so React Router can handle it
        window.history.replaceState({}, '', '/MonthlyExpenseReact' + cleanPath + window.location.search);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Service Worker registration
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          const isDevelopment = window.location.hostname === 'localhost' ||
                                window.location.hostname === '127.0.0.1' ||
                                window.location.hostname === '';

          if (isDevelopment) {
            navigator.serviceWorker.getRegistrations().then((registrations) => {
              for (let registration of registrations) {
                registration.unregister().then(() => {
                  console.log('Service Worker unregistered for development');
                });
              }
            });
          } else {
            navigator.serviceWorker.register('/MonthlyExpenseReact/service-worker.js')
              .then((registration) => {
                console.log('Service Worker registered:', registration);
              })
              .catch((error) => {
                console.log('Service Worker registration failed:', error);
              });
          }
        });
      }
    </script>
  </body>
</html>
